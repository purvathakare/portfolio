<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Retro Pixel Art Character: Purva Thakare (SIT Student with Glasses & Blazer) -->
  
  <!-- Background transparent -->
  <rect width="64" height="64" fill="transparent" />

  <!-- Hair Back -->
  <rect x="22" y="10" width="20" height="26" fill="#1b120c" />
  <rect x="18" y="14" width="28" height="24" fill="#1b120c" />
  <rect x="16" y="20" width="32" height="20" fill="#1b120c" />

  <!-- Face / Skin -->
  <rect x="22" y="14" width="20" height="18" fill="#d99b75" />
  <rect x="24" y="32" width="16" height="4" fill="#c4835e" /> <!-- Chin shadow -->

  <!-- Hair Bangs / Front -->
  <rect x="20" y="10" width="24" height="6" fill="#2b1a13" />
  <rect x="18" y="14" width="6" height="10" fill="#2b1a13" />
  <rect x="40" y="14" width="6" height="10" fill="#2b1a13" />

  <!-- Eyes & Eyebrows -->
  <rect x="23" y="19" width="6" height="2" fill="#1b120c" />
  <rect x="35" y="19" width="6" height="2" fill="#1b120c" />
  
  <rect x="24" y="22" width="4" height="4" fill="#111111" />
  <rect x="26" y="22" width="2" height="2" fill="#ffffff" /> <!-- eye shine -->
  
  <rect x="36" y="22" width="4" height="4" fill="#111111" />
  <rect x="38" y="22" width="2" height="2" fill="#ffffff" /> <!-- eye shine -->

  <!-- Round Glasses (Signature Look) -->
  <rect x="22" y="20" width="8" height="8" fill="none" stroke="#e0e0e0" stroke-width="1.5" />
  <rect x="34" y="20" width="8" height="8" fill="none" stroke="#e0e0e0" stroke-width="1.5" />
  <rect x="30" y="23" width="4" height="1" fill="#e0e0e0" /> <!-- bridge -->
  <rect x="19" y="22" width="3" height="1" fill="#e0e0e0" /> <!-- left temple -->
  <rect x="42" y="22" width="3" height="1" fill="#e0e0e0" /> <!-- right temple -->

  <!-- Blush / Cheeks -->
  <rect x="22" y="26" width="3" height="2" fill="#e27b68" opacity="0.6" />
  <rect x="39" y="26" width="3" height="2" fill="#e27b68" opacity="0.6" />

  <!-- Nose & Smile -->
  <rect x="31" y="25" width="2" height="2" fill="#b06c4b" />
  <rect x="29" y="28" width="6" height="2" fill="#994132" />
  <rect x="30" y="30" width="4" height="1" fill="#ffffff" /> <!-- teeth shine -->

  <!-- Neck -->
  <rect x="29" y="34" width="6" height="4" fill="#c4835e" />

  <!-- White Collared Shirt -->
  <polygon points="26,38 38,38 35,44 29,44" fill="#ffffff" />

  <!-- SIT Blue Tie with Red Insignia -->
  <polygon points="31,39 33,39 34,48 32,50 30,48" fill="#192a56" />
  <rect x="31" y="42" width="2" height="2" fill="#d63031" /> <!-- SIT Red Emblem -->

  <!-- Navy Blue College Blazer -->
  <rect x="18" y="38" width="8" height="20" fill="#111936" />
  <rect x="38" y="38" width="8" height="20" fill="#111936" />
  <rect x="22" y="44" width="20" height="16" fill="#192244" />
  <!-- Blazer Lapels -->
  <polygon points="22,38 27,48 24,50" fill="#0c1126" />
  <polygon points="42,38 37,48 40,50" fill="#0c1126" />

  <!-- Cute Hair Bow / Clip (matching retro reference) -->
  <rect x="42" y="12" width="5" height="5" fill="#ff4785" />
  <rect x="44" y="14" width="1" height="1" fill="#ffffff" />

  <!-- Sparkle Stars near Avatar -->
  <polygon points="12,18 14,15 16,18 14,21" fill="#ffe600" />
  <polygon points="50,22 52,19 54,22 52,25" fill="#ffe600" />
</svg>
